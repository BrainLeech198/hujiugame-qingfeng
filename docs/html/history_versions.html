<!DOCTYPE html>
<html lang="zh">
<head>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title data-i18n="history_title">氢风 · 历史版本</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/history.css">
</head>
<body id="top">

<a class="skip-link" href="#versionsContainer" data-i18n="skip_to_content">跳到主要内容</a>

<!-- 导航 -->
<nav class="top-nav" id="topNav" aria-label="主导航" data-i18n-aria="nav_label">
    <a class="nav-brand" href="#top">◈ <span>氢风</span></a>
    <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-label="展开导航菜单">☰</button>
    <div class="nav-links" id="navLinks">
        <a href="../index.html">← <span data-i18n="back_home">返回首页</span></a>
    </div>
</nav>

<div class="main-wrapper">
    <div class="page-title"><span class="sec-emoji">📜</span> <span data-i18n="history_title">历史版本</span></div>

    <div id="versionsContainer" class="versions-container">
        <div class="loading-skeleton" style="text-align:center; padding:40px;" data-i18n="loading_history">加载版本历史中...</div>
    </div>

    <div id="paginationControls" class="pagination" style="display: none;">
        <button class="page-btn" id="prevPage" disabled data-i18n="prev_page">← 上一页</button>
        <span class="page-info" id="pageInfo"></span>
        <button class="page-btn" id="nextPage" disabled data-i18n="next_page">下一页 →</button>
    </div>
</div>

<footer class="footnote">
    <div class="footer-inner">
        <div class="footer-col footer-brand">
            <span class="footer-logo"><span data-i18n="footer_text">氢风 · 官方站</span></span>
            <span class="footer-copy">&copy; HujiuGame</span>
        </div>
        <div class="footer-col footer-legal">
            <a data-i18n="footer_copyright" href="copyright/index.html">版权相关</a>
        </div>
    </div>
</footer>

<!-- 下载选项模态框 -->
<div id="downloadModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <button class="modal-back" id="modalBack">← <span id="modalBackText">返回</span></button>
            <div class="modal-title" id="modalTitle">选择下载平台</div>
            <button class="modal-close" id="modalClose" aria-label="关闭">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<script src="../js/common.js" data-base="../data/"></script>
<script src="../js/common-modal.js"></script>
<script src="../js/history.js"></script>
