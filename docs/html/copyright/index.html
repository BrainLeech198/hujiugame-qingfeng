<!DOCTYPE html>
<html lang="zh">
<head>
    <link rel="icon" type="image/x-icon" href="../../favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <title data-i18n="copyright_page_title">版权相关</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        body {
            background: var(--bg-0);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-wrapper {
            max-width: 800px;
            width: 100%;
            flex: 1;
            padding: 90px 24px 40px;
        }
        .page-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-1);
            margin-bottom: 32px;
        }
        .copyright-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .copyright-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
            border-left: 3px solid var(--accent);
            border-radius: var(--radius-card);
            padding: 20px 24px;
            transition: transform 0.3s var(--ease-out), box-shadow 0.3s var(--ease-out), border-color 0.3s var(--ease-out);
        }
        .copyright-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 0 1px var(--border-glass-strong), 0 12px 28px -8px rgba(0, 0, 0, 0.6), 0 0 20px -8px var(--glow);
            border-color: var(--accent-2);
        }
        .copyright-card a {
            color: var(--text-1);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .copyright-card a:hover {
            color: var(--accent-2);
        }
        .copyright-card .card-desc {
            font-size: 0.9rem;
            color: var(--text-3);
            margin-top: 6px;
        }
        .arrow { color: var(--text-3); font-size: 1.2rem; }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-2);
            text-decoration: none;
            font-size: 0.95rem;
            margin-bottom: 24px;
            padding: 6px 14px;
            border-radius: var(--radius-card);
            border: 1px solid var(--border-glass);
            transition: background-color 0.2s var(--ease-out), color 0.2s var(--ease-out);
        }
        .back-link:hover {
            background: rgba(79, 195, 216, 0.1);
            color: var(--accent-2);
        }
        @media (max-width: 700px) {
            .main-wrapper { padding: 80px 16px 30px; }
        }
    </style>
</head>
<body id="top">

<a class="skip-link" href="#copyright-list" data-i18n="skip_to_content">跳到主要内容</a>

    <div class="nav-links" id="navLinks">
        <a href="../../index.html">← <span data-i18n="back_home">返回首页</span></a>
    </div>
</nav>

<div class="main-wrapper">
    <div class="page-title" data-i18n="copyright_page_title">版权相关</div>

    <div class="copyright-list" id="copyright-list">
        <div class="copyright-card">
            <a href="license.html">
                <span data-i18n="copyright_license_title">项目许可证</span>
                <span class="arrow">→</span>
            </a>
            <div class="card-desc" data-i18n="copyright_license_desc">氢风项目源代码的开源许可证条款</div>
        </div>
        <div class="copyright-card">
            <a href="project_thirdparty.html">
                <span data-i18n="copyright_project_thirdparty_title">项目素材第三方版权声明</span>
                <span class="arrow">→</span>
            </a>
            <div class="card-desc" data-i18n="copyright_project_thirdparty_desc">项目中使用的第三方素材（音效、字体等）的版权信息</div>
        </div>
        <div class="copyright-card">
            <a href="thirdparty_licenses.html">
                <span data-i18n="copyright_website_thirdparty_title">网站素材第三方版权声明</span>
                <span class="arrow">→</span>
            </a>
            <div class="card-desc" data-i18n="copyright_website_thirdparty_desc">官方网站中使用的第三方素材的版权信息</div>
        </div>
    </div>
</div>

<footer class="footnote">
    <div class="footer-inner">
        <div class="footer-col footer-brand">
            <span class="footer-logo"><span data-i18n="footer_text">氢风 · 官方站</span></span>
            <span class="footer-copy">&copy; HujiuGame</span>
        </div>
        <div class="footer-col footer-legal">
            <a href="../../index.html">返回首页</a>
        </div>
    </div>
</footer>

</body>
</html>
